service:
  host: 0.0.0.0
  port: 8110
  log_level: INFO

provider:
  type: default_http
  api_url: http://127.0.0.1:20000/proxies
  api_key: ""
  pull_count: 10
  pull_interval: 1.0
  pull_timeout: 5.0
  supports_ttl: false

pool:
  max_size: 500

test_timeout: 3.0
test_concurrency: 20

ttl_sweep_interval: 1.0