service:
  host: 0.0.0.0
  port: 9000
  log_level: INFO

registry:
  route_file: e2e/configs/proxy_routes.yaml
  route_url: ""
  reload_interval: 10.0

dispatch:
  timeout: 10.0

sites:
  - name: baidu
    base_url: http://127.0.0.1:8001
    target_url: http://www.baidu.com
  - name: gongshang
    base_url: http://127.0.0.1:8002
    target_url: https://gongshang.mingluji.com/