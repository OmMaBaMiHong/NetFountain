service:
  host: 0.0.0.0
  port: 8111
  log_level: INFO

site:
  name: ttl
  target_url: http://127.0.0.1:9100/

level1:
  base_url: http://127.0.0.1:8110

sync:
  interval: 1.0
  timeout: 5.0

test:
  latency_threshold_ms: 2000
  connect_timeout: 3.0
  concurrency: 20

revalidate_interval: 60.0
ttl_sweep_interval: 1.0